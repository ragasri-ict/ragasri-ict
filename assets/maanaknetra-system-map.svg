<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">MaanakNetra system flow</title>
  <desc id="desc">Tender requirements are extracted, relevant BIS standards are retrieved, compliance is checked against standards and QCO records, and findings are returned with citations for human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101e3a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15243b"/><stop offset="1" stop-color="#101b30"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7dd3fc" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1600" height="500" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="500" rx="30" fill="url(#grid)"/>
  <text x="70" y="70" fill="#67e8f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">MAANAKNETRA · SYSTEM CONCEPT</text>
  <text x="70" y="112" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">From tender language to evidence-backed findings</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(60 175)">
      <rect width="220" height="230" rx="20" fill="url(#card)" stroke="#334155"/>
      <circle cx="110" cy="67" r="31" fill="#0e7490" fill-opacity=".23" stroke="#22d3ee" stroke-opacity=".6"/>
      <path d="M99 48h20l11 11v28H99z M119 48v13h11 M105 70h18 M105 78h18" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="132" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="700">Tender document</text>
      <text x="110" y="164" fill="#94a3b8" text-anchor="middle" font-size="14">Unstructured requirements</text>
      <text x="110" y="187" fill="#94a3b8" text-anchor="middle" font-size="14">and specifications</text>
    </g>
    <g transform="translate(370 175)">
      <rect width="220" height="230" rx="20" fill="url(#card)" stroke="#334155"/>
      <circle cx="110" cy="67" r="31" fill="#1d4ed8" fill-opacity=".22" stroke="#60a5fa" stroke-opacity=".6"/>
      <path d="M91 56h38v7H91z M91 69h26v7H91z M91 82h32v7H91z M122 68l5 5-5 5" fill="none" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="132" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="700">Extract</text>
      <text x="110" y="164" fill="#94a3b8" text-anchor="middle" font-size="14">AI-assisted parsing</text>
      <text x="110" y="187" fill="#94a3b8" text-anchor="middle" font-size="14">into structured needs</text>
    </g>
    <g transform="translate(680 175)">
      <rect width="220" height="230" rx="20" fill="url(#card)" stroke="#334155"/>
      <circle cx="110" cy="67" r="31" fill="#4338ca" fill-opacity=".22" stroke="#818cf8" stroke-opacity=".6"/>
      <circle cx="99" cy="62" r="8" fill="none" stroke="#a5b4fc" stroke-width="2.5"/><circle cx="122" cy="54" r="6" fill="none" stroke="#a5b4fc" stroke-width="2.5"/><circle cx="124" cy="79" r="7" fill="none" stroke="#a5b4fc" stroke-width="2.5"/><path d="m106 58 10-3m-10 12 12 9" stroke="#a5b4fc" stroke-width="2.5"/>
      <text x="110" y="132" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="700">Retrieve</text>
      <text x="110" y="164" fill="#94a3b8" text-anchor="middle" font-size="14">Hybrid search across</text>
      <text x="110" y="187" fill="#94a3b8" text-anchor="middle" font-size="14">relevant BIS standards</text>
    </g>
    <g transform="translate(990 175)">
      <rect width="220" height="230" rx="20" fill="url(#card)" stroke="#334155"/>
      <circle cx="110" cy="67" r="31" fill="#0f766e" fill-opacity=".24" stroke="#2dd4bf" stroke-opacity=".65"/>
      <path d="M110 43 130 51v14c0 14-9 23-20 29-11-6-20-15-20-29V51z" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linejoin="round"/><path d="m101 65 6 6 12-13" fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="110" y="132" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="700">Verify</text>
      <text x="110" y="164" fill="#94a3b8" text-anchor="middle" font-size="14">Deterministic rules +</text>
      <text x="110" y="187" fill="#94a3b8" text-anchor="middle" font-size="14">curated QCO records</text>
    </g>
    <g transform="translate(1300 175)">
      <rect width="240" height="230" rx="20" fill="url(#card)" stroke="#22d3ee" stroke-opacity=".65"/>
      <circle cx="120" cy="67" r="31" fill="#0e7490" fill-opacity=".28" stroke="#22d3ee" stroke-opacity=".75" filter="url(#glow)"/>
      <path d="M107 51h22l9 9v27h-31z M129 51v11h9 M113 70h19 M113 78h14" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="120" y="132" fill="#f8fafc" text-anchor="middle" font-size="19" font-weight="700">Explain</text>
      <text x="120" y="164" fill="#94a3b8" text-anchor="middle" font-size="14">Auditable findings with</text>
      <text x="120" y="187" fill="#94a3b8" text-anchor="middle" font-size="14">clause-level evidence</text>
    </g>
  </g>
  <g stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M282 290h76"/><path d="M592 290h76"/><path d="M902 290h76"/><path d="M1212 290h76"/>
  </g>
  <g fill="#67e8f9" filter="url(#glow)"><path d="m351 282 10 8-10 8z"/><path d="m661 282 10 8-10 8z"/><path d="m971 282 10 8-10 8z"/><path d="m1281 282 10 8-10 8z"/></g>
  <text x="800" y="465" fill="#64748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Conceptual flow based on the project README · Human review remains part of the loop</text>
</svg>
